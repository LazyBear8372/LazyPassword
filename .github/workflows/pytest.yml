name: pytest

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://ci:ci-only-password@127.0.0.1:5432/lazypassword_ci
      SECRET_KEY: ci-only-session-key
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: lazypassword_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d lazypassword_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and select Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: uv sync --locked --group test

      - name: Apply test database migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run --no-sync alembic upgrade head

      - name: Run pytest
        run: uv run --no-sync pytest
