name: Publish app image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LOCAL_IMAGE: lazypassword:ci

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: lazypassword_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d lazypassword_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build --tag "$LOCAL_IMAGE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .

      - name: Check image contents
        run: |
          docker run --rm "$LOCAL_IMAGE" python -c '
          import sys
          from pathlib import Path
          assert sys.version_info[:2] == (3, 12)
          for name in (".env", ".git", ".claude", "DEPLOY.md", "TODO.md"):
              assert not Path("/app", name).exists(), name
          assert all(p.name == ".env.example" for p in Path("/app").glob(".env*"))
          '

      - name: Verify migration and app startup
        run: |
          trap 'docker logs image-smoke; docker rm -f image-smoke' EXIT
          docker run --detach --name image-smoke --network host \
            --env DATABASE_URL=postgresql+psycopg2://ci:ci-only-password@127.0.0.1:5432/lazypassword_ci \
            --env SECRET_KEY=ci-only-session-key \
            "$LOCAL_IMAGE"
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8000/login >/dev/null; then
              docker exec image-smoke .venv/bin/alembic current
              exit 0
            fi
            echo "Waiting for app ($attempt/30)"
            sleep 2
          done
          exit 1

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: 'v0.76.2'
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          format: table
          # 첫 검사 결과를 검토한 뒤 취약점으로 게시를 차단할 기준을 정한다.
          exit-code: '0'

      # 검증한 이미지를 그대로 전달해 게시 단계에서 다시 빌드하지 않는다.
      - name: Save verified image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save --output "$RUNNER_TEMP/app-image.tar" "$LOCAL_IMAGE"

      - name: Upload verified image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-image
          path: ${{ runner.temp }}/app-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish to GHCR
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Download verified image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-image
          path: ${{ runner.temp }}

      - name: Load and tag image
        run: |
          docker load --input "$RUNNER_TEMP/app-image.tar"
          image_ref="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA"
          docker tag "$LOCAL_IMAGE" "$image_ref"
          printf 'IMAGE_REF=%s\n' "$image_ref" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        run: |
          docker push "$IMAGE_REF"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REF")
          printf '### Published image\n\n`%s`\n\nDigest: `%s`\n' \
            "$IMAGE_REF" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
