<div class="password-generator">
  <button type="button" class="button password-generator-toggle" aria-controls="password-generator-panel"
          aria-expanded="false" aria-label="비밀번호 생성기" title="비밀번호 생성기">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15.5 14a5.5 5.5 0 1 0-5.34-6.83L3 14.33V19h4v-3h3v-3h2.17A5.48 5.48 0 0 0 15.5 14Z"/>
      <circle cx="16" cy="8.5" r="1"/>
    </svg>
    <span>비밀번호 생성기</span>
  </button>
  <section id="password-generator-panel" class="password-generator-panel"
           aria-labelledby="password-generator-title" hidden>
    <h2 id="password-generator-title">비밀번호 생성기</h2>
    <textarea class="password-generator-value" aria-label="생성된 비밀번호" rows="2" readonly
              autocomplete="off" spellcheck="false"></textarea>
    <label class="password-generator-length">
      <span>길이 <span class="password-generator-count" aria-hidden="true">20자</span></span>
      <input type="range" min="8" max="64" value="20">
    </label>
    <fieldset class="password-generator-options" aria-label="포함할 문자">
      <label><input type="checkbox" role="switch" value="uppercase" checked>영문 대문자</label>
      <label><input type="checkbox" role="switch" value="lowercase" checked>영문 소문자</label>
      <label><input type="checkbox" role="switch" value="numbers" checked>숫자</label>
      <label><input type="checkbox" role="switch" value="symbols" checked>특수문자</label>
    </fieldset>
    <div class="password-generator-actions">
      <button type="button" class="button outline password-regenerate">다시 생성</button>
      <button type="button" class="button primary password-copy">복사</button>
    </div>
    <p class="password-generator-status" role="status"></p>
  </section>
</div>
