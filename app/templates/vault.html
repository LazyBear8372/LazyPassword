{% extends "base.html" %}
{% block title %}볼트 - LazyPassword{% endblock %}
{% block header %}
<header class="site-header">
  {% include "brand.html" %}
  <div class="header-actions">
    {% include "theme-toggle.html" %}
    <button type="button" id="logout-btn" class="button logout">로그아웃</button>
  </div>
</header>
{% endblock %}
{% block content %}
<main class="vault-shell">
  <h1>내 비밀번호 볼트</h1>
  <div class="vault-tools">
    <div class="search-field">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="7"/>
        <path d="m16 16 5 5"/>
      </svg>
      <input type="search" id="search" aria-label="제목·카테고리로 검색" placeholder="제목·카테고리로 검색">
    </div>
    <button type="button" id="add-item" class="button primary add-button">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M12 3v18M3 12h18"/>
      </svg>
      새 항목 추가
    </button>
  </div>
  <p id="error" class="form-error" role="alert"></p>
  <p id="status" class="visually-hidden" role="status"></p>
  <p id="empty-state" class="empty-state" hidden></p>
  <ul id="item-list" class="cards"></ul>
</main>

<dialog id="item-dialog" class="item-dialog" aria-labelledby="form-title">
  <h2 id="form-title">새 항목 추가</h2>
  <form id="item-form" autocomplete="off">
    <label for="title">제목</label>
    <input id="title" required autofocus>
    <label for="username">아이디</label>
    <input id="username">
    <label for="password">비밀번호</label>
    <input id="password" type="password" autocomplete="new-password">
    <label for="url">URL</label>
    <input id="url" inputmode="url">
    <label for="category">카테고리</label>
    <input id="category">
    <p id="item-error" class="form-error" role="alert"></p>
    <div class="form-actions">
      <button type="button" id="cancel-edit" class="button outline">취소</button>
      <button type="submit" id="submit-btn" class="button primary">추가</button>
    </div>
  </form>
</dialog>

<template id="external-link-icon">
  <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M14 3h7v7m0-7-11 11M19 13v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h7"/>
  </svg>
</template>
<script src="/static/js/vault.js"></script>
{% endblock %}
