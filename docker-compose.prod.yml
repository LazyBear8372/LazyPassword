services:
  db:
    image: postgres:16
    container_name: lazypassword-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: lazypassword-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DB host는 컨테이너 네트워크의 서비스명 'db' (로컬 .env의 localhost를 override)
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      # nginx 뒤에 있으므로 프록시 헤더(X-Forwarded-*)를 신뢰
      FORWARDED_ALLOW_IPS: "*"
    # 마이그레이션 후 WAS가 로그인 페이지를 제공할 준비가 됐는지 확인한다.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8000/login", timeout=2) as response:
              raise SystemExit(response.status != 200)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  server:
    image: nginx:1.27
    container_name: lazypassword-server
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  pgdata:
